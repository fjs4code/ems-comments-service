name: Tests

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '25'
          cache: gradle

      - name: Run tests with Gradle Wrapper
        run: bash ./gradlew clean test --no-daemon --console=plain
